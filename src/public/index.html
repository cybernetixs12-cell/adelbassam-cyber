<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Waitlist</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a class="nav-brand" href="/">
        Restaurant Waitlist
      </a>

      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/staff-login.html">Staff Login</a>
      </div>
    </div>
  </nav>

  <header>
    <div class="container">
      <h1>Restaurant Waitlist</h1>
      <p>Join the queue and check your position.</p>
    </div>
  </header>

  <main class="container">
    <div class="customer-grid">
      <section class="card">
        <h2>Join Waitlist</h2>

        <form id="joinForm">
          <div class="form-group">
            <label for="name">Name</label>

            <input
              id="name"
              type="text"
              placeholder="Enter your name"
              required
            />
          </div>

          <div class="form-group">
            <label for="partySize">Party size</label>

            <input
              id="partySize"
              type="number"
              min="1"
              step="1"
              placeholder="Number of people"
              required
            />
          </div>

          <button type="submit">
            Join Waitlist
          </button>
        </form>

        <p id="joinResult" class="result"></p>
      </section>

      <section class="card">
        <h2>Check My Position</h2>

        <div class="form-group">
          <label for="ticketNumber">Ticket number</label>

          <input
            id="ticketNumber"
            type="number"
            min="1"
            placeholder="Enter your ticket number"
          />
        </div>

        <button id="checkPosition">
          Check Position
        </button>

        <p id="positionResult" class="result"></p>
      </section>
    </div>

    <div class="staff-link">
      <a href="/staff-login.html">Staff Login</a>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
