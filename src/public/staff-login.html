<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Staff Login</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a class="nav-brand" href="/">
        Restaurant Waitlist
      </a>

      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/staff-login.html">Staff Login</a>
      </div>
    </div>
  </nav>

  <header>
    <div class="container">
      <h1>Staff Login</h1>
      <p>Sign in to manage the restaurant waitlist.</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Employee Login</h2>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>

          <input
            id="username"
            type="text"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="pin">PIN</label>

          <input
            id="pin"
            type="password"
            inputmode="numeric"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit">
          Log In
        </button>
      </form>

      <p id="loginResult" class="result"></p>
    </section>
  </main>

  <script src="/staff-login.js"></script>
</body>
</html>
